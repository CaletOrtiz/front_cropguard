name: kroppi
description: "Aplicación Flutter para diagnóstico de cultivos."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  equatable: ^3.0.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  fpdart: ^1.2.0
  go_router: ^17.2.0
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  intl: ^0.20.2
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
